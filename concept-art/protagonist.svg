<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="'Trebuchet MS',sans-serif">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.8"><stop offset="0" stop-color="#3a2c52"/><stop offset="1" stop-color="#1a1430"/></radialGradient>
    <style>
      .skin{fill:#f0c9a0;} .skinSh{fill:#d8a878;}
      .hair{fill:#5a3d22;} .hairHi{fill:#7a5230;}
      .hood{fill:#c0402e;} .hoodHi{fill:#d9573f;}
      .fleece{fill:#6b5640;} .fleeceSh{fill:#574532;}
      .shoulder{fill:#2a2620;} .red{fill:#c0402e;}
      .jeans{fill:#3a4a6a;} .jeansSh{fill:#2e3c56;}
      .lbl{fill:#ffe9a0;font-size:13px;font-weight:bold;text-anchor:middle;}
      .note{fill:#c8b8e8;font-size:11px;}
      .eye{fill:#241a30;}
    </style>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="58" fill="#1a1430"/>
  <text x="28" y="30" fill="#ffe9a0" font-size="20" font-weight="bold">YOU — Cem's nephew · protagonist concept</text>
  <text x="28" y="48" fill="#b6a8d8" font-size="12" font-style="italic">stylized design informed by the reference photo (not a likeness render) · messy wavy hair · red-hoodie + brown/red fleece jacket</text>
  <rect x="0" y="57" width="800" height="2" fill="#f4c430"/>

  <!-- ===================== PORTRAIT BUST ===================== -->
  <g transform="translate(150,210)">
    <!-- shoulders: jacket -->
    <path d="M-78 120 Q-78 40 -40 30 L40 30 Q78 40 78 120 Z" class="fleece"/>
    <path d="M-78 120 Q-78 44 -44 32 L-30 120 Z" class="shoulder"/>
    <path d="M78 120 Q78 44 44 32 L30 120 Z" class="shoulder"/>
    <path d="M-44 34 L-30 120 -20 120 -34 36 Z" class="red"/><path d="M44 34 L30 120 20 120 34 36 Z" class="red"/>
    <!-- red hoodie V + collar -->
    <path d="M-30 30 L0 92 L30 30 Q14 24 0 24 Q-14 24 -30 30 Z" class="hood"/>
    <path d="M-12 30 L0 70 L12 30 Z" class="hoodHi"/>
    <!-- neck -->
    <rect x="-15" y="-6" width="30" height="44" class="skin"/><rect x="-15" y="-6" width="30" height="10" class="skinSh"/>
    <!-- head -->
    <ellipse cx="0" cy="-40" rx="46" ry="50" class="skin"/>
    <path d="M-46 -36 Q-44 -8 -30 6 L30 6 Q44 -8 46 -36 Z" class="skinSh" opacity="0.0"/>
    <!-- light stubble jaw -->
    <path d="M-40 -30 Q0 18 40 -30 Q40 6 0 16 Q-40 6 -40 -30 Z" fill="#caa078" opacity="0.35"/>
    <!-- messy wavy hair (lobes) -->
    <g class="hair">
      <path d="M-48 -44 Q-54 -92 -8 -94 Q40 -100 50 -58 Q56 -34 44 -34 Q48 -60 30 -66 Q40 -44 22 -50 Q30 -74 6 -72 Q14 -50 -2 -58 Q0 -84 -22 -74 Q-14 -52 -30 -58 Q-26 -40 -44 -42 Z"/>
      <circle cx="-30" cy="-78" r="13"/><circle cx="-8" cy="-86" r="15"/><circle cx="16" cy="-84" r="14"/><circle cx="36" cy="-70" r="12"/><circle cx="-42" cy="-62" r="11"/><circle cx="44" cy="-52" r="10"/>
    </g>
    <g class="hairHi" opacity="0.6"><circle cx="-6" cy="-88" r="6"/><circle cx="20" cy="-82" r="5"/><circle cx="-28" cy="-78" r="5"/></g>
    <!-- brows + eyes (earnest, caught mid-sentence) -->
    <path d="M-26 -46 q9 -5 18 -2 M8 -48 q9 -3 18 1" stroke="#4a3320" stroke-width="3" fill="none"/>
    <circle cx="-15" cy="-38" r="4" class="eye"/><circle cx="15" cy="-40" r="4" class="eye"/>
    <ellipse cx="0" cy="-12" rx="6" ry="4" fill="#7a4634"/> <!-- slightly open mouth -->
    <path d="M-46 -44 Q-52 -22 -44 -8" stroke="#d8a878" stroke-width="2" fill="none"/>
    <text x="0" y="150" class="lbl">portrait</text>
  </g>

  <!-- ===================== FULL BODY ===================== -->
  <g transform="translate(400,150)">
    <!-- head (small) -->
    <ellipse cx="0" cy="0" rx="24" ry="26" class="skin"/>
    <g class="hair"><circle cx="-12" cy="-18" r="9"/><circle cx="2" cy="-22" r="10"/><circle cx="14" cy="-16" r="8"/><circle cx="-20" cy="-10" r="7"/><circle cx="20" cy="-8" r="6"/><path d="M-22 -8 Q-24 -30 0 -32 Q24 -30 22 -8 L18 -16 Q0 -24 -18 -14 Z"/></g>
    <circle cx="-8" cy="2" r="2.6" class="eye"/><circle cx="8" cy="2" r="2.6" class="eye"/>
    <rect x="-9" y="24" width="18" height="16" class="skin"/>
    <!-- jacket torso -->
    <path d="M-40 40 Q-46 44 -46 70 L-44 150 L44 150 L46 70 Q46 44 40 40 Q20 34 0 34 Q-20 34 -40 40 Z" class="fleece"/>
    <path d="M-46 44 L-40 110 -30 110 -40 46 Z" class="shoulder"/><path d="M46 44 L40 110 30 110 40 46 Z" class="shoulder"/>
    <path d="M-40 70 L40 70 38 84 -38 84 Z" class="red"/>                        <!-- red chest stripe -->
    <path d="M-16 40 L0 96 L16 40 Q8 36 0 36 Q-8 36 -16 40 Z" class="hood"/>     <!-- red hoodie -->
    <rect x="-3" y="40" width="6" height="100" fill="#3a2f24"/>                   <!-- zipper -->
    <!-- arms (hands in pockets, like the photo) -->
    <path d="M-44 64 Q-66 86 -54 124 L-40 120 Q-48 92 -34 78 Z" class="fleece"/>
    <path d="M44 64 Q66 86 54 124 L40 120 Q48 92 34 78 Z" class="fleece"/>
    <ellipse cx="-48" cy="126" rx="12" ry="9" class="jeans"/><ellipse cx="48" cy="126" rx="12" ry="9" class="jeans"/> <!-- hands in jean pockets -->
    <!-- jeans -->
    <path d="M-40 150 L-40 250 -8 250 -4 156 Z" class="jeans"/><path d="M40 150 L40 250 8 250 4 156 Z" class="jeans"/>
    <rect x="-40" y="150" width="80" height="10" class="jeansSh"/>
    <!-- shoes -->
    <ellipse cx="-24" cy="256" rx="20" ry="8" fill="#2a2420"/><ellipse cx="24" cy="256" rx="20" ry="8" fill="#2a2420"/>
    <text x="0" y="280" class="lbl">full body</text>
  </g>

  <!-- ===================== SPÄTI APRON VARIANT ===================== -->
  <g transform="translate(640,150)">
    <ellipse cx="0" cy="0" rx="24" ry="26" class="skin"/>
    <g class="hair"><circle cx="-12" cy="-18" r="9"/><circle cx="2" cy="-22" r="10"/><circle cx="14" cy="-16" r="8"/><circle cx="-20" cy="-10" r="7"/><circle cx="20" cy="-8" r="6"/><path d="M-22 -8 Q-24 -30 0 -32 Q24 -30 22 -8 L18 -16 Q0 -24 -18 -14 Z"/></g>
    <circle cx="-8" cy="2" r="2.6" class="eye"/><circle cx="8" cy="2" r="2.6" class="eye"/>
    <rect x="-9" y="24" width="18" height="16" class="skin"/>
    <!-- jacket torso (same) -->
    <path d="M-40 40 Q-46 44 -46 70 L-44 150 L44 150 L46 70 Q46 44 40 40 Q20 34 0 34 Q-20 34 -40 40 Z" class="fleece"/>
    <path d="M-16 40 L0 96 L16 40 Q8 36 0 36 Q-8 36 -16 40 Z" class="hood"/>
    <!-- apron over it -->
    <path d="M-30 56 L30 56 L34 150 L-34 150 Z" fill="#3a6e6a"/>
    <path d="M-12 44 L-8 60 8 60 12 44 Z" fill="#3a6e6a"/>                        <!-- bib -->
    <rect x="-34" y="96" width="68" height="3" fill="#2a4f4c"/>
    <rect x="-22" y="108" width="44" height="24" rx="3" fill="#2a4f4c"/>          <!-- apron pocket -->
    <!-- Cem's keys on a lanyard (the symbol) -->
    <rect x="-2" y="60" width="4" height="40" fill="#caa24a"/><rect x="-8" y="98" width="16" height="12" rx="2" fill="#f4c430"/><rect x="-6" y="110" width="3" height="6" fill="#f4c430"/><rect x="0" y="110" width="3" height="8" fill="#f4c430"/>
    <text x="0" y="180" class="lbl">"on shift" variant</text>
    <text x="0" y="196" class="note" text-anchor="middle">jacket + Späti apron + Cem's keys</text>
  </g>

  <!-- notes + colour key -->
  <g transform="translate(28,470)">
    <text x="0" y="0" fill="#ffe9a0" font-size="13" font-weight="bold">Design notes</text>
    <text x="0" y="20" class="note">• Mid-20s, light skin, light stubble; <tspan fill="#f4e9cf">messy wavy/curly brown hair</tspan> (the photo's signature).</text>
    <text x="0" y="38" class="note">• Signature outfit: <tspan fill="#f4e9cf">red hoodie under a brown-fleece / black-&amp;-red zip jacket</tspan> + blue jeans — his "uniform."</text>
    <text x="0" y="56" class="note">• Read: earnest, a little tired, caught mid-sentence — "drifted back, one foot out the door." Hands-in-pockets default pose.</text>
  </g>
  <g transform="translate(560,460)">
    <text x="0" y="0" fill="#ffe9a0" font-size="12" font-weight="bold">palette</text>
    <g transform="translate(0,8)">
      <rect width="22" height="16" class="hair"/><rect x="24" width="22" height="16" class="skin"/><rect x="48" width="22" height="16" class="hood"/>
      <rect x="72" width="22" height="16" class="fleece"/><rect x="96" width="22" height="16" class="shoulder"/><rect x="120" width="22" height="16" class="red"/><rect x="144" width="22" height="16" class="jeans"/>
    </g>
  </g>
</svg>
