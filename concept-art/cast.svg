<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" font-family="'Trebuchet MS',sans-serif">
  <defs>
    <radialGradient id="warm" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#3a2c52"/><stop offset="1" stop-color="#1d162f"/>
    </radialGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2440"/><stop offset="1" stop-color="#1a1430"/>
    </linearGradient>
    <style>
      .panel{fill:url(#warm);stroke:#4a3a66;stroke-width:2;rx:10;}
      .nb{fill:#1a1430;}
      .nm{fill:#ffe9a0;font-size:14px;font-weight:bold;text-anchor:middle;}
      .ds{fill:#c8b8e8;font-size:10px;text-anchor:middle;font-style:italic;}
      .sh{stroke-linejoin:round;}
    </style>
  </defs>
  <rect width="760" height="900" fill="#14102a"/>
  <!-- header -->
  <rect x="0" y="0" width="760" height="64" fill="url(#hdr)"/>
  <text x="30" y="32" fill="#ffe9a0" font-size="22" font-weight="bold">SPÄTI — the main cast</text>
  <text x="30" y="52" fill="#b6a8d8" font-size="12" font-style="italic">concept / casting board · Coffee-Talk × Papers-Please portraits (mood + design intent, not final art)</text>
  <rect x="0" y="63" width="760" height="2" fill="#f4c430"/>

  <!-- ============ ROW 1 ============ -->
  <!-- YOU (the heir) -->
  <g transform="translate(24,84)">
    <rect class="panel" width="224" height="246" rx="10"/>
    <g transform="translate(112,96)">
      <rect x="-44" y="36" width="88" height="70" rx="20" fill="#c0402e"/>             <!-- jacket -->
      <rect x="-44" y="36" width="88" height="22" rx="20" fill="#d9573f"/>
      <circle cx="0" cy="0" r="38" fill="#f1c79b" stroke="#caa278" stroke-width="2"/>   <!-- head -->
      <path d="M-40 -8 Q0 -56 40 -8 L40 -26 Q0 -48 -40 -26 Z" fill="#4a2f1a"/>          <!-- hair -->
      <circle cx="-13" cy="2" r="3.5" fill="#241a30"/><circle cx="13" cy="2" r="3.5" fill="#241a30"/>
      <path d="M-20 -10 q7 -6 14 -1 M6 -11 q7 -5 14 1" stroke="#3a2a1a" stroke-width="2" fill="none"/>
      <path d="M-9 18 Q0 23 9 18" stroke="#a06a4a" stroke-width="2.5" fill="none"/>
      <rect x="-3" y="44" width="6" height="34" fill="#caa24a"/><rect x="-9" y="76" width="18" height="12" rx="2" fill="#f4c430"/> <!-- Cem's key lanyard -->
    </g>
    <rect class="nb" x="0" y="206" width="224" height="40"/>
    <text class="nm" x="112" y="224">YOU — the heir</text><text class="ds" x="112" y="239">drifted back; one foot out the door</text>
  </g>
  <!-- Onkel Cem (in memoriam) -->
  <g transform="translate(268,84)">
    <rect class="panel" width="224" height="246" rx="10"/>
    <rect x="14" y="14" width="40" height="34" rx="3" fill="#2a2440" stroke="#caa24a"/><text x="34" y="36" text-anchor="middle" font-size="16" fill="#ffe08a">✝</text>
    <g transform="translate(112,98)" opacity="0.92">
      <rect x="-46" y="38" width="92" height="68" rx="14" fill="#7a6a4a"/>              <!-- apron -->
      <rect x="-46" y="38" width="92" height="68" rx="14" fill="#8a7a58" opacity="0.5"/>
      <circle cx="0" cy="0" r="38" fill="#d6a877" stroke="#b88a5c" stroke-width="2"/>
      <path d="M-40 -6 Q0 -46 40 -6 L40 -20 Q0 -40 -40 -20 Z" fill="#a9a0b0"/>          <!-- grey hair -->
      <circle cx="-13" cy="2" r="3.2" fill="#3a2a30"/><circle cx="13" cy="2" r="3.2" fill="#3a2a30"/>
      <path d="M-18 16 q18 12 36 0" stroke="#9a8a78" stroke-width="6" fill="none"/>      <!-- grey moustache -->
      <path d="M-10 24 Q0 30 10 24" stroke="#7a5a3a" stroke-width="2.5" fill="none"/>
    </g>
    <rect class="nb" x="0" y="206" width="224" height="40"/>
    <text class="nm" x="112" y="224">ONKEL CEM</text><text class="ds" x="112" y="239">who left you the Späti — and the debt</text>
  </g>
  <!-- Mehmet -->
  <g transform="translate(512,84)">
    <rect class="panel" width="224" height="246" rx="10"/>
    <g transform="translate(112,98)">
      <rect x="-46" y="38" width="92" height="68" rx="14" fill="#3f6e8c"/>
      <rect x="-20" y="-44" width="40" height="20" rx="4" fill="#f0f0f0"/>              <!-- paper hat -->
      <circle cx="0" cy="0" r="38" fill="#c89868" stroke="#a87a4c" stroke-width="2"/>
      <path d="M-40 -10 Q0 -44 40 -10 L40 -22 Q0 -40 -40 -22 Z" fill="#2a2018"/>
      <circle cx="-13" cy="2" r="3.5" fill="#241a30"/><circle cx="13" cy="2" r="3.5" fill="#241a30"/>
      <path d="M-22 15 q22 16 44 0" stroke="#241810" stroke-width="8" fill="none"/>      <!-- big moustache -->
    </g>
    <rect class="nb" x="0" y="206" width="224" height="40"/>
    <text class="nm" x="112" y="224">MEHMET</text><text class="ds" x="112" y="239">döner next door · Cem's friend · your conscience</text>
  </g>

  <!-- ============ ROW 2 ============ -->
  <!-- Lena -->
  <g transform="translate(24,344)">
    <rect class="panel" width="224" height="246" rx="10"/>
    <g transform="translate(112,98)">
      <rect x="-42" y="38" width="84" height="68" rx="14" fill="#6b4c8a"/>
      <circle cx="0" cy="0" r="37" fill="#f1c79b" stroke="#caa278" stroke-width="2"/>
      <path d="M-38 6 Q-44 -34 0 -40 Q44 -34 38 6 L38 -8 Q0 -30 -38 -8 Z" fill="#7a3a2a"/> <!-- reddish hair -->
      <path d="M-40 -28 Q0 -48 40 -28 L40 -40 Q0 -52 -40 -40 Z" fill="#3a8a8a"/>          <!-- beanie -->
      <circle cx="-13" cy="2" r="3.4" fill="#241a30"/><circle cx="13" cy="2" r="3.4" fill="#241a30"/>
      <path d="M-10 18 Q0 24 10 17" stroke="#a06a4a" stroke-width="2.5" fill="none"/>
      <rect x="22" y="-30" width="22" height="5" rx="2" fill="#caa24a" transform="rotate(30 33 -27)"/><rect x="40" y="-20" width="8" height="6" fill="#d9442e" transform="rotate(30 44 -17)"/> <!-- paintbrush -->
      <circle cx="-22" cy="20" r="3" fill="#4a9e4a"/><circle cx="20" cy="14" r="2.5" fill="#2e7fb8"/> <!-- paint flecks -->
    </g>
    <rect class="nb" x="0" y="206" width="224" height="40"/>
    <text class="nm" x="112" y="224">LENA</text><text class="ds" x="112" y="239">art student · always 50ct short</text>
  </g>
  <!-- Bottle-Jürgen -->
  <g transform="translate(268,344)">
    <rect class="panel" width="224" height="246" rx="10"/>
    <g transform="translate(112,98)">
      <rect x="-44" y="38" width="88" height="68" rx="14" fill="#4a5240"/>              <!-- worn coat -->
      <path d="M28 44 l30 -10 8 22 -30 10 z" fill="#5a4a2a"/>                            <!-- bottle bag -->
      <rect x="40" y="30" width="6" height="14" rx="2" fill="#3f8f6f"/><rect x="48" y="28" width="6" height="16" rx="2" fill="#8a6a2a"/>
      <circle cx="0" cy="0" r="37" fill="#d8b48c" stroke="#b08858" stroke-width="2"/>
      <path d="M-40 -16 Q0 -42 40 -16 L40 -26 Q0 -40 -40 -26 Z" fill="#7a6a5a"/>          <!-- knit cap (grey) -->
      <rect x="-40" y="-22" width="80" height="10" rx="4" fill="#6a5a4a"/>
      <circle cx="-12" cy="2" r="3.2" fill="#241a30"/><circle cx="12" cy="2" r="3.2" fill="#241a30"/>
      <path d="M-20 16 q20 6 40 0" stroke="#b0a090" stroke-width="3" fill="none" opacity="0.7"/> <!-- stubble hint -->
      <path d="M-8 22 Q0 25 8 22" stroke="#8a6a4a" stroke-width="2" fill="none"/>
    </g>
    <rect class="nb" x="0" y="206" width="224" height="40"/>
    <text class="nm" x="112" y="224">"BOTTLE" JÜRGEN</text><text class="ds" x="112" y="239">der Flaschensammler · quiet dignity</text>
  </g>
  <!-- Frau Brandt -->
  <g transform="translate(512,344)">
    <rect class="panel" width="224" height="246" rx="10"/>
    <g transform="translate(112,98)">
      <rect x="-44" y="38" width="88" height="68" rx="10" fill="#2b3550"/>              <!-- blazer -->
      <path d="M-10 38 L0 64 L10 38 Z" fill="#e8eaf0"/>                                  <!-- blouse V -->
      <circle cx="0" cy="0" r="37" fill="#ecc6a0" stroke="#c89c72" stroke-width="2"/>
      <path d="M-40 4 Q-46 -40 0 -42 Q46 -40 40 4 L40 -6 Q0 -8 -40 -6 Z" fill="#6a5a4a"/> <!-- sharp bob -->
      <circle cx="-13" cy="0" r="3.2" fill="#241a30"/><circle cx="13" cy="0" r="3.2" fill="#241a30"/>
      <path d="M-9 16 L9 16" stroke="#a06a4a" stroke-width="2.5"/>                        <!-- thin flat smile -->
      <rect x="-58" y="44" width="26" height="34" rx="2" fill="#1f2a3a" stroke="#9ab" stroke-width="1.5"/> <!-- tablet/clipboard -->
    </g>
    <rect class="nb" x="0" y="206" width="224" height="40"/>
    <text class="nm" x="112" y="224">FRAU BRANDT</text><text class="ds" x="112" y="239">the developer's face · not a villain, the machine</text>
  </g>

  <!-- ============ ROW 3 ============ -->
  <!-- Tobias -->
  <g transform="translate(24,604)">
    <rect class="panel" width="224" height="246" rx="10"/>
    <g transform="translate(112,98)">
      <rect x="-44" y="38" width="88" height="68" rx="16" fill="#3a7d6a"/>              <!-- hoodie -->
      <path d="M-44 40 q44 26 88 0 l0 14 q-44 22 -88 0 z" fill="#2f6a58"/>
      <circle cx="0" cy="0" r="37" fill="#f1c79b" stroke="#caa278" stroke-width="2"/>
      <path d="M-38 -6 Q0 -40 38 -6 L38 -16 Q0 -34 -38 -16 Z" fill="#3a2a1a"/>          <!-- undercut -->
      <rect x="-40" y="-2" width="80" height="6" fill="#3a2a1a"/>
      <circle cx="-13" cy="2" r="3.5" fill="#241a30"/><circle cx="13" cy="2" r="3.5" fill="#241a30"/>
      <path d="M-18 16 Q-12 22 -6 17 M6 16 q14 8 24 -2" stroke="#3a2a1a" stroke-width="3" fill="none"/> <!-- beard hint -->
      <path d="M-10 16 Q0 24 10 16" stroke="#a06a4a" stroke-width="2.5" fill="none"/>
      <rect x="30" y="-4" width="5" height="10" rx="2" fill="#fff"/>                     <!-- airpod -->
    </g>
    <rect class="nb" x="0" y="206" width="224" height="40"/>
    <text class="nm" x="112" y="224">TOBIAS</text><text class="ds" x="112" y="239">new-money transplant · tips big · the soft front of change</text>
  </g>
  <!-- Frau Schulz -->
  <g transform="translate(268,604)">
    <rect class="panel" width="224" height="246" rx="10"/>
    <g transform="translate(112,98)">
      <rect x="-44" y="38" width="88" height="68" rx="14" fill="#7a5a4a"/>              <!-- cardigan -->
      <circle cx="0" cy="0" r="37" fill="#ecc6a0" stroke="#c89c72" stroke-width="2"/>
      <path d="M-42 0 Q-42 -44 0 -44 Q42 -44 42 0 L36 6 Q0 -16 -36 6 Z" fill="#caa24a"/> <!-- headscarf -->
      <path d="M-40 2 Q0 -18 40 2 L40 12 Q0 -6 -40 12 Z" fill="#b8b0c0"/>                <!-- grey hair front -->
      <circle cx="-13" cy="2" r="3.2" fill="#241a30"/><circle cx="13" cy="2" r="3.2" fill="#241a30"/>
      <circle cx="-13" cy="2" r="9" fill="none" stroke="#cfc8e0" stroke-width="2"/><circle cx="13" cy="2" r="9" fill="none" stroke="#cfc8e0" stroke-width="2"/><path d="M-4 2 L4 2" stroke="#cfc8e0" stroke-width="2"/> <!-- glasses -->
      <path d="M-8 20 L8 20" stroke="#a06a4a" stroke-width="2.5"/>
    </g>
    <rect class="nb" x="0" y="206" width="224" height="40"/>
    <text class="nm" x="112" y="224">FRAU SCHULZ</text><text class="ds" x="112" y="239">East-Berlin Oma · watched the Wall fall from here</text>
  </g>
  <!-- Nadia -->
  <g transform="translate(512,604)">
    <rect class="panel" width="224" height="246" rx="10"/>
    <g transform="translate(112,98)">
      <rect x="-44" y="38" width="88" height="68" rx="14" fill="#2f8a8a"/>              <!-- scrubs (teal) -->
      <path d="M-12 38 L0 58 L12 38" fill="none" stroke="#247070" stroke-width="3"/>
      <circle cx="0" cy="0" r="37" fill="#9a6a44" stroke="#7a4f30" stroke-width="2"/>   <!-- brown skin -->
      <path d="M-38 -2 Q-40 -42 0 -44 Q40 -42 38 -2 L34 -8 Q0 -26 -34 -8 Z" fill="#1f1620"/> <!-- hair tied back -->
      <circle cx="-13" cy="2" r="3.4" fill="#1a1020"/><circle cx="13" cy="2" r="3.4" fill="#1a1020"/>
      <path d="M-9 18 Q0 24 9 18" stroke="#6a3f28" stroke-width="2.5" fill="none"/>
      <rect x="-60" y="46" width="18" height="24" rx="3" fill="#e8e0d0"/><rect x="-60" y="46" width="18" height="6" fill="#caa24a"/> <!-- coffee cup -->
    </g>
    <rect class="nb" x="0" y="206" width="224" height="40"/>
    <text class="nm" x="112" y="224">NADIA</text><text class="ds" x="112" y="239">night-shift nurse · single mum · the 4am regular</text>
  </g>

  <text x="380" y="884" text-anchor="middle" fill="#6a5d92" font-size="11">+ the wider cast (Aylin &amp; Jonas, Karim, Achim, Robin, Esra &amp; Nilay, Herr Bley…) — see narrative-design.md</text>
</svg>
